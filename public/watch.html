<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Assistindo Câmera - MaxLive</title>
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <main class="viewer-stage-fullscreen">
        <video id="remote-video" autoplay playsinline></video>
        <div id="connection-overlay" class="connection-overlay">
            <p>Conectando à câmera...</p>
        </div>
        <button id="btn-ativar-som" class="btn-ativar-som hidden" aria-label="Ativar som">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <span>Toque para ativar o som</span>
        </button>
    </main>

    <script src="/config.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        // cameraId é opcional: se ausente, a página segue automaticamente a
        // câmera marcada como "Selecionada" no dashboard (link único por sessão).
        const cameraId = params.get('camera');

        if (!token) {
            document.body.innerHTML = '<div class="viewer-message-screen"><h1>Link inválido</h1><p>Este link não identifica uma sessão válida.</p></div>';
            throw new Error('Token ausente na URL.');
        }

        window.__SECURITYCAM_CONFIG__ = {
            token,
            cameraId,
            serverUrl: window.SECURITYCAM_SERVER_URL
        };
    </script>
    <script src="/js/webrtc-common.js"></script>
    <script src="/js/watch.js"></script>
</body>
</html>
